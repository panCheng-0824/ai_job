networks:
  app-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
          gateway: 172.20.0.1
    labels:
      environment: "development"

volumes:
  es-data:
  es-plugins:
  neo4j-data:
  redis-data:
  milvus-etcd:
  milvus-minio:
  milvus-storage:
  mysql-data:
  postgres-data:
  mongodb_data:
  rabbitmq-data:
  nginx-conf:
  nginx-static:



services:
  elasticsearch:
    image: elasticsearch:8.11.0
    container_name: es
    networks:
      - app-network
    ports:
      - "9200:9200"
      - "9300:9300"
    environment:
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms2g -Xmx2g
      - cluster.name=app-cluster
      - bootstrap.memory_lock=true
      - http.cors.enabled=true
      - http.cors.allow-origin="*"
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - es-data:/usr/share/elasticsearch/data
      - es-plugins:/usr/share/elasticsearch/plugins
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:9200/_cat/health?h=status || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 4g
        reservations:
          memory: 2g

  neo4j:
    image: neo4j
    container_name: neo4j
    networks:
      - app-network
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD:-123456}
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_server_memory_heap_max__size=1G
      - NEO4J_server_memory_pagecache_size=512M
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*
    volumes:
      - neo4j-data:/data
      - ./neo4j/plugins:/plugins
      - ./neo4j/import:/var/lib/neo4j/import
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p ${NEO4J_PASSWORD:-123456} 'RETURN 1' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2g
        reservations:
          memory: 1g

  redis:
    image: redis
    container_name: redis
    networks:
      - app-network
    ports:
      - "6379:6379"
    command: >
      sh -c "redis-server
      --requirepass ${REDIS_PASSWORD:-123456}
      --appendonly yes
      --save 900 1
      --save 300 10
      --save 60 10000
      --maxmemory 2gb
      --maxmemory-policy allkeys-lru"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD:-123456} --raw incr ping"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 4g
        reservations:
          memory: 1g

  milvus-etcd:
    image: quay.io/coreos/etcd:v3.5.9
    container_name: milvus-etcd
    networks:
      - app-network
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - milvus-etcd:/etcd
    command:
      - etcd
      - -advertise-client-urls=http://0.0.0.0:2379
      - -listen-client-urls=http://0.0.0.0:2379
      - --data-dir=/etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2g

  milvus-minio:
    image: minio/minio
    container_name: milvus-minio
    networks:
      - app-network
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_SECRET_KEY:-minioadmin}
    ports:
      - "9001:9001"
    volumes:
      - milvus-minio:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:9000/minio/health/live || curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 4g

  milvus-standalone:
    image: milvusdb/milvus
    container_name: milvus
    networks:
      - app-network
    ports:
      - "19530:19530"
      - "9091:9091"
    environment:
      - ETCD_ENDPOINTS=milvus-etcd:2379
      - MINIO_ADDRESS=milvus-minio:9000
      # 必须与 milvus-minio 的 MINIO_ROOT_* 一致，否则会出现签名错误、Proxy 长期 NotReady
      - MINIO_ACCESS_KEY_ID=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_SECRET_ACCESS_KEY=${MINIO_SECRET_KEY:-minioadmin}
      - KNOWHERE_GPU_RESOURCE_ENABLE=false
      - CGO_CFLAGS=-DKNOWHERE_NO_GPU
      - MILVUS_CPU_MEM_LIMIT=4G
      - MILVUS_SCHEDULER_TASK_QUEUE_SIZE=64
      - MILVUS_QUERY_NODE_ENABLE_DISK=true
      - MILVUS_DATA_NODE_SYNC_PERIOD=600
    volumes:
      - milvus-storage:/var/lib/milvus
    depends_on:
      milvus-etcd:
        condition: service_healthy
      milvus-minio:
        condition: service_healthy
    entrypoint: ["milvus", "run", "standalone"]
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9091/healthz || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 6g
          cpus: '2'
        reservations:
          memory: 2g
          cpus: '1'

  mysql:
    image: mysql:latest
    container_name: mysql
    networks:
      - app-network
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-123456}
      - MYSQL_DATABASE=app_db
      - MYSQL_USER=${MYSQL_USER:-root}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-app_password}
      - MYSQL_CHARACTER_SET_SERVER=utf8mb4
      - MYSQL_COLLATION_SERVER=utf8mb4_unicode_ci
      - TZ=Asia/Shanghai
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d
      - ./mysql/conf:/etc/mysql/conf.d
    command:
      - mysqld
      - --max_connections=500
      - --innodb_buffer_pool_size=4G
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-123456}", "ping", "-h", "localhost"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 6g
        reservations:
          memory: 2g

  postgres:
    image: postgres:16
    container_name: postgres
    networks:
      - app-network
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-root}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-123456}
      - POSTGRES_DB=${POSTGRES_DB:-app_db}
      - TZ=Asia/Shanghai
      - PGTZ=Asia/Shanghai
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d
      - ./postgres/conf:/etc/postgresql
    command:
      - "postgres"
      - "-c"
      - "max_connections=200"
      - "-c"
      - "shared_buffers=2GB"
      - "-c"
      - "work_mem=32MB"
      - "-c"
      - "maintenance_work_mem=512MB"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-root} -d ${POSTGRES_DB:-app_db}"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 4g
        reservations:
          memory: 2g
          
  mongodb:
    image: mongo:7.0
    container_name: server-job-mongodb
    networks:
      - app-network
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-root}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:-root123}
      MONGO_INITDB_DATABASE: server_job
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db        
  rocketmq-nameserver:
    image: apache/rocketmq:5.3.1
    container_name: server-job-rocketmq-nameserver
    networks:
      - app-network
    restart: unless-stopped
    command: sh mqnamesrv
    ports:
      - "9876:9876"

  rocketmq-broker:
    image: apache/rocketmq:5.3.1
    container_name: server-job-rocketmq-broker
    networks:
      - app-network
    restart: unless-stopped
    depends_on:
      - rocketmq-nameserver
    command: sh mqbroker -n rocketmq-nameserver:9876 --enable-proxy
    environment:
      NAMESRV_ADDR: rocketmq-nameserver:9876
    ports:
      - "10909:10909"
      - "10911:10911"
      - "10912:10912"        

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    networks:
      - app-network
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_USER:-root}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASSWORD:-pc0824tq}
      - RABBITMQ_DEFAULT_VHOST=/
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1g
        reservations:
          memory: 512m
          

  nginx:
    image: nginx
    container_name: nginx
    networks:
      - app-network
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - nginx-conf:/etc/nginx/conf.d
      - nginx-static:/usr/share/nginx/html/static
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - elasticsearch
      - mysql
      - postgres
      - redis
      - neo4j
      - milvus-standalone
    healthcheck:
      test: ["CMD-SHELL", "nginx -t && wget -q --spider http://localhost/ || curl -f http://localhost/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512m
        reservations:
          memory: 256m
