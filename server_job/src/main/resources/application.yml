spring:
  application:
    name: server_job
  mvc:
    async:
      # 全局异步请求超时（含未单独指定 WebAsyncTask 的 StreamingResponseBody 等），避免默认 ~30s 长会话被掐断
      request-timeout: 30m
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:app_db}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:pc0824tq}
    driver-class-name: com.mysql.cj.jdbc.Driver

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:pc0824tq}
      database: ${REDIS_DATABASE:0}
      timeout: 5s
    mongodb:
      uri: mongodb://${MONGODB_USER:${MONGO_INITDB_ROOT_USERNAME:root}}:${MONGODB_PASSWORD:${MONGO_INITDB_ROOT_PASSWORD:pc0824tq}}@${MONGODB_HOST:localhost}:${MONGODB_PORT:27017}/${MONGODB_DATABASE:server_job}?authSource=admin
    neo4j:
      uri: bolt://${NEO4J_HOST:localhost}:${NEO4J_BOLT_PORT:7687}
      authentication:
        username: ${NEO4J_USER:neo4j}
        password: ${NEO4J_PASSWORD:pc0824tq}
    elasticsearch:
      uris: http://${ELASTICSEARCH_HOST:localhost}:${ELASTICSEARCH_PORT:9200}
      username: ${ELASTICSEARCH_USER:elastic}
      password: ${ELASTICSEARCH_PASSWORD:elastic123456}

server:
  port: 8002

# 聊天 SSE 单独 WebAsyncTask 超时（可与全局 spring.mvc.async.request-timeout 一致或更大，例如长推理）
chat:
  stream:
    async-request-timeout: 10m

# 智能采集 NDJSON 流式超时
ai-search:
  stream:
    async-request-timeout: 10m

# 登录成功后写入 Redis，供 ai_job 按学号读取（键前缀 + 学号）
student:
  redis-key-prefix: ${STUDENT_PROFILE_REDIS_PREFIX:student:profile:}
  cache-ttl-hours: ${STUDENT_PROFILE_CACHE_TTL_HOURS:168}

# RocketMQ 5 Proxy gRPC（与 ai_job ROCKETMQ_PROXY_GRPC_ENDPOINT 一致，宿主机 18081→容器 8081）
rocketmq:
  producer:
    endpoints: ${ROCKETMQ_PROXY_GRPC_ENDPOINT:127.0.0.1:18081}
    # topic 在代码中指定；勿在此写逗号分隔多 topic（v5 SDK 预取校验会失败）
    ssl-enabled: ${ROCKETMQ_SSL_ENABLED:false}
    request-timeout: ${ROCKETMQ_REQUEST_TIMEOUT:10}
    max-attempts: 3
  push-consumer:
    endpoints: ${ROCKETMQ_PROXY_GRPC_ENDPOINT:127.0.0.1:18081}
    tag: "*"

minio:
  enabled: ${MINIO_ENABLED:true}
  endpoint: ${MINIO_ENDPOINT:http://127.0.0.1:9000}
  access-key: ${MINIO_ACCESS_KEY:${MINIO_ROOT_USER:root}}
  # 与 MinIO 官方 Docker 变量 MINIO_ROOT_PASSWORD 对齐；也可用 MINIO_SECRET_KEY
  secret-key: ${MINIO_SECRET_KEY:${MINIO_ROOT_PASSWORD:pc0824tq}}
  bucket: ${MINIO_BUCKET:job-portal}
  # 浏览器访问对象 URL 前缀（需与 endpoint 对外地址一致）
  public-base-url: ${MINIO_PUBLIC_BASE_URL:http://panjintong.top:9000}
  avatar-max-bytes: ${MINIO_AVATAR_MAX_BYTES:2097152}

milvus:
  host: ${MILVUS_HOST:localhost}
  port: ${MILVUS_PORT:19530}
  username: ${MILVUS_USER:root}
  password: ${MILVUS_PASSWORD:Milvus}
  database: ${MILVUS_DATABASE:default}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

# ROLE005 模拟面试官：业务在 server_job，AI 计算转发 ai_job
interview:
  enabled: ${ROLE005_INTERVIEW_ENABLED:true}
  service-token: ${SERVER_JOB_SERVICE_TOKEN:}
  mq:
    enabled: ${INTERVIEW_MQ_ENABLED:true}
    consumer-enabled: ${INTERVIEW_MQ_CONSUMER_ENABLED:true}
    proxy-endpoint: ${ROCKETMQ_PROXY_ENDPOINT:127.0.0.1:18080}
    proxy-grpc-endpoint: ${ROCKETMQ_PROXY_GRPC_ENDPOINT:127.0.0.1:18081}
    ssl-enabled: ${ROCKETMQ_SSL_ENABLED:false}
    topics:
      ai-task: ${INTERVIEW_MQ_TOPIC_AI_TASK:interview_ai_task}
      ai-result: ${INTERVIEW_MQ_TOPIC_AI_RESULT:interview_ai_result}
      timer-event: ${INTERVIEW_MQ_TOPIC_TIMER:interview_timer_event}
      dlq: ${INTERVIEW_MQ_TOPIC_DLQ:interview_dlq}
    producer-group: ${ROCKETMQ_PRODUCER_GROUP:server_job_producer}
    consumer-groups:
      ai-result: ${INTERVIEW_MQ_CONSUMER_AI_RESULT:server_job_interview_result_consumer}
      ai-task: ${INTERVIEW_MQ_CONSUMER_AI_TASK:server_job_interview_task_consumer}

ai-job:
  base-url: ${AI_JOB_BASE_URL:http://127.0.0.1:8001}
  # 调用 ai_job 的 OkHttp 超时（RAG LightRAG insert 在 ai_job 侧默认最长轮询 600s，读超时需覆盖）
  http:
    connect-timeout: ${AI_JOB_HTTP_CONNECT_TIMEOUT:8s}
    read-timeout: ${AI_JOB_HTTP_READ_TIMEOUT:15m}
    write-timeout: ${AI_JOB_HTTP_WRITE_TIMEOUT:2m}
  rag:
    insert-path: ${AI_JOB_RAG_INSERT_PATH:/rag/lightrag/insert}
    purge-non-processed-path: ${AI_JOB_RAG_PURGE_NON_PROCESSED_PATH:/rag/lightrag/purge-non-processed}
    backlog-stats-path: ${AI_JOB_RAG_BACKLOG_STATS_PATH:/rag/lightrag/backlog-stats}
    greprag-text-to-md-path: ${AI_JOB_GREPRAG_TEXT_TO_MD_PATH:/rag/greprag/text-to-md}
    source: ${AI_JOB_RAG_SOURCE:server_job}
    # 批量/并行 RAG 同步线程池核心线程数；队列容量为 Integer.MAX_VALUE（不限制排队长度）
    sync-thread-pool-core-size: ${AI_JOB_RAG_SYNC_THREAD_POOL_CORE_SIZE:3}
